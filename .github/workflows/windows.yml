name: Windows CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

defaults:
  run:
    shell: pwsh

jobs:
  tests:
    name: Test Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      IPGUARD_WFP_VM_ENABLE: '0'
    steps:
      - name: Get source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore packages
        run: dotnet restore IPGuard.slnx --locked-mode

      - name: Run safe tests
        run: dotnet test IPGuard.slnx --configuration Release --no-restore --logger trx --results-directory artifacts/test-results

      - name: Save test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14

  build-and-deploy:
    name: Build and deploy Windows x64
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      APP_ASSET: IPGuard-win-x64.exe
    steps:
      - name: Get source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set release version
        id: version
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Restore release packages
        run: dotnet restore src/Desktop/Desktop.csproj --locked-mode -p:PublishProfile=Windows

      - name: Build Windows app
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: dotnet publish src/Desktop/Desktop.csproj --configuration Release --no-restore -p:PublishProfile=Windows -p:Version=$env:APP_VERSION -p:FileVersion=$env:APP_VERSION --output artifacts/publish/win-x64

      - name: Verify and package Windows app
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $files = @(Get-ChildItem -LiteralPath artifacts/publish/win-x64 -Recurse -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'Desktop.exe') { throw 'Expected one self-contained Windows executable.' }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($files[0].FullName)
          if ($info.FileVersion -ne $env:APP_VERSION -or -not $info.ProductVersion.StartsWith($env:APP_VERSION, [StringComparison]::Ordinal)) { throw 'Executable version does not match the release.' }
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          $executable = "artifacts/release/$env:APP_ASSET"
          Copy-Item -LiteralPath $files[0].FullName -Destination $executable
          $hash = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $executable)" | Set-Content -LiteralPath "$executable.sha256" -Encoding utf8NoBOM

      - name: Save Windows app
        uses: actions/upload-artifact@v7
        with:
          name: IPGuard-${{ steps.version.outputs.value }}-windows-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ steps.version.outputs.value }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          @"
          Windows x64 application shell. Network protection is not enabled yet.

          Version: $env:APP_VERSION
          Download and run $env:APP_ASSET. The .NET runtime and native libraries are included.
          Source commit: $env:SOURCE_SHA
          Tests and build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "@ | Set-Content -LiteralPath artifacts/release-notes.md -Encoding utf8NoBOM
          gh release create "v$env:APP_VERSION" "artifacts/release/$env:APP_ASSET" "artifacts/release/$env:APP_ASSET.sha256" --target $env:SOURCE_SHA --title "IPGuard v$env:APP_VERSION" --notes-file artifacts/release-notes.md --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
