name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Build and test Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Get source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore packages
        run: dotnet restore IPGuard.slnx --locked-mode

      - name: Build Release
        run: dotnet build IPGuard.slnx --configuration Release --no-restore

      - name: Run safe tests
        run: dotnet test IPGuard.slnx --configuration Release --no-build --no-restore --logger trx --results-directory artifacts/test-results

      - name: Publish Windows app
        run: dotnet publish src/Desktop/Desktop.csproj --configuration Release --runtime win-x64 --self-contained false --no-build --no-restore --output artifacts/publish/win-x64

      - name: Save Windows app
        uses: actions/upload-artifact@v7
        with:
          name: IPGuard-windows-x64
          path: artifacts/publish/win-x64/
          if-no-files-found: error
          retention-days: 14

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14
